name: Foundation Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate foundation artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate required documents
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "docs/PRODUCT_REQUIREMENTS.md"
            "docs/architecture/REFERENCE_ARCHITECTURE.md"
            "docs/security/SECURITY_BASELINE.md"
            "docs/licensing/OFFLINE_LICENSING.md"
            "docs/engineering/GATE_0_1_ACCEPTANCE.md"
            "docs/architecture/decisions/README.md"
            "docs/architecture/decisions/ADR-0001-modular-monolith.md"
            "docs/architecture/decisions/ADR-0002-tenant-isolation.md"
            "docs/architecture/decisions/ADR-0003-identity-access.md"
            "docs/architecture/decisions/ADR-0004-database-governance.md"
            "docs/architecture/decisions/ADR-0005-offline-licensing.md"
            "docs/architecture/decisions/ADR-0006-ai-provider-independence.md"
            "docs/architecture/decisions/ADR-0007-customer-hosted-deployment.md"
            "docs/architecture/decisions/ADR-0008-ci-quality-security-gates.md"
            "docs/engineering/GATE_0_1_3_ARCHITECTURE_ASSURANCE.md"
            "docs/security/GATE_0_1_4_THREAT_MODEL.md"
            "docs/security/GATE_0_1_5_TENANT_IDENTITY_BOUNDARY.md"
            "docs/engineering/GATE_0_1_6_DEPENDENCY_CI_GOVERNANCE.md"
            "docs/licensing/GATE_0_1_7_LICENCE_PROTOCOL.md"
            "docs/architecture/GATE_0_1_7_PLATFORM_BLUEPRINT.md"
            "docs/engineering/GATE_0_1_7_CLOSURE_AND_REVIEW.md"
            "docs/security/GATE_0_1_8_BOUNDARY_PROOF_PLAN.md"
            "proof/tenant_boundary/README.md"
            "docs/security/GATE_0_1_9_1_INTERNAL_ASSESSMENT.md"
            "docs/security/GATE_0_1_9_2_BROKER_ASSESSMENT.md"
            "docs/security/GATE_0_1_9_3_RECOVERY_ASSESSMENT.md"
            "docs/security/GATE_0_1_9_4_DURABLE_STATE_ASSESSMENT.md"
            "docs/architecture/decisions/ADR-0009-transaction-registry-recovery.md"
            "docs/security/GATE_0_1_10_LICENCE_AUDIT_ASSURANCE.md"
            "proof/licence_audit/README.md"
            "docs/security/GATE_0_1_10_1_ISSUER_STATE_ASSURANCE.md"
            "docs/security/GATE_0_1_10_2_UNIVERSAL_VALIDATOR.md"
            "proof/universal_licence/README.md"
            "docs/licensing/GATE_0_1_10_3_CRM_TIER_POLICY.md"
            "docs/security/GATE_0_1_10_3_PERSISTENT_UNIVERSAL_STATE.md"
            "docs/security/GATE_0_1_10_4_RENEWAL_GOVERNANCE.md"
            "docs/engineering/GATE_0_1_11_CONSOLIDATED_ACCEPTANCE.md"
            "docs/engineering/GATE_0_1_11_OWNER_DECISION_REGISTER.md"
            "docs/engineering/GATE_0_1_11_INDEPENDENT_REVIEW_BRIEF.md"
            "docs/engineering/GATE_0_1_11_1_GOVERNANCE_AND_DESIGN_CLEARANCE.md"
            "docs/engineering/GATE_0_1_12_REMEDIATION_REGISTER.md"
            "docs/security/GATE_0_1_12_1_ACTOR_BOUNDARY.md"
            "docs/security/GATE_0_1_13_INDEPENDENT_AUTHORITY_AUDIT.md"
            "docs/security/GATE_0_1_13_1_SIGNED_RECEIPTS_FENCING.md"
            "docs/security/GATE_0_1_13_2_PERSISTENT_RECEIPT_FLOOR.md"
            "docs/security/GATE_0_1_13_3_DURABLE_RECEIPT_RECOVERY.md"
            "docs/security/GATE_0_1_14_IDENTITY_AND_LICENSING_BOUNDARY.md"
            "docs/security/GATE_0_1_14_1_CALLBACK_SESSION_REMEDIATION.md"
            "docs/security/GATE_0_1_14_2_BACKEND_ENTITLEMENT_BOUNDARY.md"
            "docs/licensing/GATE_0_1_14_3_ISSUER_CERTIFICATION_PREFLIGHT.md"
            "docs/security/GATE_0_1_14_4_ATOMIC_MUTATION_CERTIFICATION.md"
          )
          for file in "${required_files[@]}"; do
            git ls-files --error-unmatch -- "$file" >/dev/null
            test -f "$file" && test ! -L "$file" && test -s "$file" || { echo "Missing, empty or non-regular document: $file"; exit 1; }
            grep -q '^# ' "$file" || { echo "Missing document title: $file"; exit 1; }
          done
          echo "All required foundation and architecture documents validated."

      - name: Check actual change range
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$PR_HEAD_SHA^{commit}"
            echo "PR head: $PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$base" != 0000000000000000000000000000000000000000 ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          git cat-file -e "$GITHUB_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Checking $base -> $GITHUB_SHA"
          git diff --check "$base" "$GITHUB_SHA" --

  tenant-boundary-proof:
    name: Disposable PostgreSQL boundary proof
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Compile proof harness
        run: python3 -m py_compile proof/tenant_boundary/run.py proof/tenant_boundary/broker.py proof/tenant_boundary/recovery_state.py proof/tenant_boundary/actor_broker.py proof/tenant_boundary/independent_authority.py proof/tenant_boundary/authority_receipt.py proof/tenant_boundary/receipt_floor.py proof/tenant_boundary/oidc_boundary.py proof/tenant_boundary/oidc_fixture.py proof/tenant_boundary/licence_bridge.py
      - name: Validate bridge syntax
        run: |
          node --check proof/universal_licence/read_bridge.mjs
          node --check proof/universal_licence/read_fixture.mjs
          node --check proof/universal_licence/mutation_claim.mjs
      - name: Run real PostgreSQL proof
        env:
          PROOF_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 proof/tenant_boundary/run.py

      - name: Run disposable licence and audit proof
        run: |
          python3 -m py_compile proof/licence_audit/protocol.py proof/licence_audit/run.py proof/licence_audit/state.py
          python3 proof/licence_audit/run.py

      - name: Run universal issuer compatibility proof
        run: |
          node --version
          node --test proof/universal_licence/validator.test.mjs proof/universal_licence/state.test.mjs proof/universal_licence/current_issuer.test.mjs
